[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-migration-tools"
version = "1.0.0"
description = "Shared SQL Server migration tooling (sync, run, stamp, bootstrap) for Databasecode-style projects."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Databasecode maintainers" }]
keywords = ["sql-server", "migrations", "dacpac", "ssdt", "etl"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
]
dependencies = []

[project.scripts]
sql-mig = "sql_mig.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
